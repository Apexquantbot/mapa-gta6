<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mapa de secretos de Leonida · GTA VI</title>
<style>
:root{
  --bg:#0d0b14; --panel:#16131f; --panel2:#1f1a2c; --line:#2e2740; --txt:#f3eefc; --mut:#a39bb8;
  --sea1:#0f2a3d; --sea2:#0a1c2b; --land:#2a3b2c; --land2:#33492f; --sand:#6b5d3d;
  --acc:#ff5fa2; --acc2:#ffb347;
  --c-sec:#b57bff; --c-egg:#ff7ad1; --c-rare:#ffd24a; --c-hid:#ff8a3d; --c-veh:#5fe0a0; --c-wpn:#5cb8ff; --c-mis:#ff4f5e; --c-mil:#9bd34a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
header{padding:10px 12px 8px;background:linear-gradient(90deg,#2a0f2e,#1b1230 55%,#0f2233);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
h1{font-size:17px;margin:0;letter-spacing:.3px;line-height:1.15}
h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:11px;color:var(--mut);margin-top:2px}
.prog{margin-left:auto;text-align:right;font-size:11px;color:var(--mut);white-space:nowrap}
.prog b{display:block;font-size:16px;color:var(--txt)}
.bar{height:4px;background:#ffffff14;border-radius:4px;margin-top:4px;overflow:hidden;width:90px;margin-left:auto}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.search{margin-top:8px;display:flex;gap:6px}
.search input{flex:1;background:#00000040;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 11px;font-size:14px;outline:none}
.search input:focus{border-color:var(--acc)}
.search button{background:#00000040;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:0 11px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:#00000033;color:var(--txt);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;user-select:none}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.off{opacity:.38}
.chip small{color:var(--mut)}
main{flex:1;position:relative;min-height:0;display:flex}
#mapWrap{flex:1;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 60% 40%,var(--sea1),var(--sea2))}
svg#map{width:100%;height:100%;display:block;cursor:grab}
svg#map.drag{cursor:grabbing}
.region{font-size:15px;fill:#ffffff55;font-weight:700;letter-spacing:2px;text-anchor:middle;pointer-events:none;text-transform:uppercase}
.place{font-size:9px;fill:#ffffffa0;text-anchor:middle;pointer-events:none}
.pin{cursor:pointer}
.pin circle.b{stroke:#0d0b14;stroke-width:1.6}
.pin text{font-size:9px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin.found circle.b{opacity:.35}
.pin.found text{opacity:.4}
.pin.sel circle.ring{stroke:#fff;stroke-width:2;fill:none}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#16131fe6;color:var(--txt);font-size:18px}
.legendNote{position:absolute;left:8px;bottom:8px;font-size:10px;color:#ffffff80;background:#0008;padding:4px 7px;border-radius:6px;pointer-events:none;max-width:70%}
#card{position:absolute;left:8px;right:8px;bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;z-index:5;box-shadow:0 10px 40px #000a;transform:translateY(130%);transition:transform .25s;max-height:62%;overflow:auto}
#card.show{transform:none}
#card .cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
#card h2{margin:4px 0 2px;font-size:18px}
#card .where{font-size:12px;color:var(--mut);margin-bottom:8px}
#card .row{font-size:13.5px;line-height:1.45;margin:6px 0}
#card .row b{color:#fff}
#card .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#ffffff12;border:1px solid var(--line);margin:2px 4px 0 0}
#card .tag.warn{border-color:#ff4f5e88;color:#ff9aa3}
#card .actions{display:flex;gap:8px;margin-top:10px}
#card .actions button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:13.5px}
#card .actions button.on{background:linear-gradient(90deg,#ff5fa2,#ff8a3d);border-color:transparent;font-weight:700}
#card .x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--mut);font-size:22px}
#list{width:340px;background:var(--panel);border-left:1px solid var(--line);overflow:auto}
.li{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.li:active,.li:hover{background:var(--panel2)}
.li .ic{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px}
.li .t{font-size:14px;font-weight:600}
.li .w{font-size:11.5px;color:var(--mut);margin-top:2px}
.li.found .t{text-decoration:line-through;opacity:.55}
.li .ck{margin-left:auto;font-size:16px;opacity:.8}
.listHead{position:sticky;top:0;background:var(--panel);padding:10px 12px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;z-index:1}
.listHead label{display:flex;gap:5px;align-items:center}
.tabs{display:none}
@media (max-width:760px){
  #list{display:none;position:absolute;inset:0;width:auto;border:0;z-index:4}
  body.listMode #list{display:block}
  .tabs{display:flex;border-top:1px solid var(--line);background:var(--panel)}
  .tabs button{flex:1;padding:11px;background:none;border:0;color:var(--mut);font-size:14px;font-weight:600}
  .tabs button.act{color:var(--txt);box-shadow:inset 0 2px 0 var(--acc)}
}
.info{padding:12px;font-size:11.5px;color:var(--mut);line-height:1.5}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="top">
    <div>
      <h1><span>Secretos de Leonida</span></h1>
      <div class="sub">Mapa no oficial de GTA VI · lo que hay que buscar</div>
    </div>
    <div class="prog"><b id="pCount">0/0</b>encontrados<div class="bar"><i id="pBar"></i></div></div>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Buscar: Infernus, búnker, OVNI, Hamlet…" autocomplete="off">

  <div style="display:flex;gap:6px;margin-top:6px">

    <a href="https://mapgenie.io/grand-theft-auto-6/maps/leonida" style="flex:1;text-align:center;background:#00000040;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px;font-size:12.5px;text-decoration:none">🗺️ Ver mapa real ↗</a>

<main>

      <defs>

          <stop offset="0" stop-color="#3a4a2c"/><stop offset=".55" stop-color="#2c4430"/><stop offset="1" stop-color="#26402f"/>
        </linearGradient>
        <pattern id="swamp" width="14" height="14" patternUnits="userSpaceOnUse">

              fill="url(#landG)" stroke="#c9b27a" stroke-width="2.5" stroke-opacity=".55"/>

          <path d="M220 290 L360 300 L560 330 L700 420 L800 600 L820 720"/>
          <path d="M430 160 L520 200 L560 330"/>
          <path d="M800 700 L700 860 L640 930 L520 975 L320 1010"/>

        </g>
        <!-- islas oeste -->

          <ellipse cx="255" cy="455" rx="22" ry="12"/><ellipse cx="232" cy="482" rx="11" ry="7"/>
          <ellipse cx="300" cy="615" rx="12" ry="7"/><ellipse cx="318" cy="640" rx="9" ry="6"/><ellipse cx="290" cy="648" rx="8" ry="5"/>
          <ellipse cx="350" cy="752" rx="9" ry="6"/>
          <ellipse cx="150" cy="700" rx="16" ry="10"/>

          <ellipse cx="905" cy="700" rx="10" ry="55"/><ellipse cx="880" cy="650" rx="10" ry="6"/><ellipse cx="878" cy="690" rx="8" ry="5"/><ellipse cx="878" cy="722" rx="9" ry="5"/><ellipse cx="890" cy="605" rx="9" ry="6"/>

<script>
const CATS = {
  sec:{n:"Secretos y misterios",c:"var(--c-sec)",i:"👽"},
  mis:{n:"Misiones secretas",c:"var(--c-mis)",i:"❗"},
  rare:{n:"Coches exclusivos",c:"var(--c-rare)",i:"🏎️"},
  hid:{n:"Coches escondidos",c:"var(--c-hid)",i:"🔑"},
  mil:{n:"Material militar",c:"var(--c-mil)",i:"🪖"},
  veh:{n:"Aviones y helicópteros",c:"var(--c-veh)",i:"🚁"},
  wpn:{n:"Armas ocultas",c:"var(--c-wpn)",i:"🔫"},
  egg:{n:"Easter eggs",c:"var(--c-egg)",i:"🥚"}
};
// x,y en el esquema; d = qué es; h = cómo conseguirlo; r = recompensa; t = etiquetas; w = zona
const P = [
// ---- SECRETOS
{id:"glider",c:"sec",x:250,y:455,n:"Planeador estrellado",w:"Bobcat Bight · islas al NO de North Mariana County",d:"Restos de un planeador con el paracaídas enganchado en un árbol.",h:"Llega en barco o moto de agua. Dispara al paracaídas colgado para que caigan los restos y registra la zona.",r:"Pistola legendaria Turnt Nipper .38",t:["Necesitas barco"]},
{id:"sos",c:"sec",x:150,y:700,n:"Isla SOS",w:"Golfo de Leonida, muy al oeste de Watson Bay",d:"Isla perdida con un SOS escrito en la arena.",h:"Busca en el suelo junto a la primera «S» del mensaje.",r:"Un móvil con una grabación estilo «metraje encontrado»; también se han visto fragmentos de meteorito",t:["Necesitas barco"]},
{id:"cooldog",c:"sec",x:270,y:735,n:"Cool Dog y la playa secreta de perros",w:"Mar abierto al oeste · Gambit Bay",d:"Un perro en moto de agua te rescata si te quedas tirado en el mar.",h:"Abandona tu barco y nada mar adentro sin vehículo. Es aleatorio: si no aparece, prueba en otra zona del mar.",r:"Te lleva a una playa escondida llena de perros",t:["Aleatorio"]},
{id:"meteor",c:"sec",x:420,y:150,n:"Meteorito morado",w:"Mount Kalaga · ladera este de Table Rock",d:"Un objeto morado sin explicación caído del cielo.",h:"Sube a la cima de Table Rock y baja por el lado este. Mejor en moto o todoterreno; busca entre hondonadas rocosas y vegetación.",r:"Pista del misterio de los meteoritos",t:[]},
{id:"bunker",c:"sec",x:385,y:128,n:"Torre y búnker secreto",w:"Parque Nacional Mount Kalaga · Lummox County",d:"Torre con escalera y una caseta de madera cerrada con teclado.",h:"Sube la escalera de la torre: en los carteles de arriba hay una combinación. Baja y métela en el teclado de la caseta.",r:"Cuaderno de registro con el dibujo de una figura misteriosa",t:["Código 69185"]},
{id:"ufohouse",c:"sec",x:690,y:412,n:"La casa del paranoico",w:"Belville · Leonard County",d:"Casa clara de una planta con puerta de garaje blanca, dos palmeras y valla blanca.",h:"Fuerza la puerta del garaje (si te ven, viene la policía). Dentro hay notas de alguien convencido de vivir en un videojuego, con referencias a «J» y «L». Ojo con el maletero del coche de fuera: salen serpientes.",r:"Lore / curiosidad",t:["Puede atraer policía"]},
{id:"ufo",c:"sec",x:300,y:305,n:"Abducción OVNI",w:"Bosque junto al Starlet Motel · al este de Port Gellhorn",d:"Un coche con luces parpadeando en la cuneta y un rastro hacia el bosque.",h:"Tras el Capítulo 1, ve sobre las 2:00 de la madrugada, mejor sin el otro protagonista. Sigue el rastro, ponte debajo del OVNI para cortar la abducción, habla con la mujer y devuélvele el coche. No sale todas las veces.",r:"Logro «The Truth Is Out There» y arranque de la cadena del alien",t:["Noche","Tras Cap. 1"]},
{id:"monument",c:"sec",x:145,y:240,n:"Monumento a la Supremacía Leonidana",w:"Manifest Canyon, junto a la carretera SR-73 · al norte de Port Gellhorn (Kelly County)",d:"Estatua de 1982 con cuatro caballos alrededor de un pilar y un globo. Tienen símbolos parecidos a cartas estelares y uno lleva un cono de tráfico.",h:"Acércate: el mando empieza a vibrar y suenan pitidos que parecen código Morse. Se cree que tiene relación con los círculos de piedra de la cima de Mount Kalaga. Aún nadie lo ha resuelto: puede que sea el «Mount Chiliad» de este juego.",r:"Sin resolver",t:["Sin resolver"]},
{id:"skunk",c:"sec",x:410,y:715,n:"Skunk Ape (el «Bigfoot» de Leonida)",w:"Humedales al sur de Hamlet · Cottonmouth Lake",d:"Criatura que vigila el cadáver de un ciervo.",h:"Encuentra el cadáver, sigue a la criatura al bosque hasta una figura humana hecha de ramas y examínala. Las misiones relacionadas empiezan con el folleto de Kirk.",r:"Encuentro paranormal",t:["Noche"]},
{id:"ritual",c:"sec",x:790,y:595,n:"Ritual en el almacén de Capri",w:"Norte de Capri · Vice City",d:"Un pentagrama y un ritual inquietante en un almacén abandonado.",h:"Entra en el almacén abandonado del norte de Capri y explóralo a fondo.",r:"Escena secreta",t:["Ubicación aproximada"]},
{id:"eggs",c:"sec",x:745,y:800,n:"Huevos de Pascua «literales»",w:"Torre de comunicaciones · sur de Vice-Dale County",d:"Un nido con huevos en lo alto de una torre altísima.",h:"Sube por las escaleras exteriores (6-7 minutos reales). Coge un huevo y lánzalo desde el borde con toda la fuerza: si lo tiras flojo no salta la escena.",r:"Escena cómica oculta",t:[]},
{id:"portal",c:"sec",x:600,y:812,n:"Portal al Vice City clásico",w:"Torre del sur del mapa → 12 subestaciones eléctricas → central eléctrica",d:"El secreto más rebuscado hasta ahora: un portal que te lleva al Vice City de PS2.",h:"1) En una torre del sur del mapa hay un botón que suena a Vice City y un póster que alude al viejo truco de PC «Life Is Passing Me By». 2) Por el mapa hay 12 subestaciones marcadas con letras: acciona sus palancas y botones en el orden que deletrea el truco (unos 30 min). 3) Te llega un mensaje: ve a la central eléctrica en la franja horaria indicada y abre la puerta metálica: hay un portal rosa. Apareces en el Malibu Club original.",r:"Camisa hawaiana azul de Tommy Vercetti y una moto chopper con la bandera",t:["Ubicación aproximada","Largo"]},
{id:"canyoncave",c:"egg",x:160,y:228,n:"Grieta-cueva y tarjeta de Manifest Canyon",w:"Manifest Canyon · Kelly County",d:"Una entrada a una cueva por una grieta estrecha en un acantilado, y una tarjeta Nine1Nine escondida.",h:"Busca la grieta en la pared del cañón. Por la zona también está la tarjeta morada de Chrissie y el escaneo WAiNK del huerto de manzanas de Farmer Scrumpy.",r:"Tarjeta coleccionable (~175 $) + escaneo",t:[]},
// ---- MISIONES SECRETAS
{id:"alien",c:"mis",x:465,y:675,n:"Sueños alienígenas · rescata al alien",w:"South Point Airfield · Hamlet (Mariana County)",d:"Continuación del OVNI: sueño alienígena, puzles y una instalación secreta.",h:"Haz antes la abducción OVNI. Al dormir despiertas en la nave: pasa a escondidas la sala de huevos, mira la maqueta del sistema solar (señala un lugar de Leonida) y abre el candado contando las rayas dibujadas encima. En el panel pulsa los 4 botones hasta que coincidan todas las luces; se abren 3 puertas: evita la del centro. Consigue la leche de vaca alienígena y, ya en la Tierra, dásela al pequeño alien en el laboratorio bajo la torre de radio del aeródromo para ayudarle a escapar.",r:"Mejoras permanentes de salud, resistencia y concentración para los dos protagonistas + trofeo",t:["Cap. 2+"]},
{id:"merle",c:"mis",x:798,y:625,n:"Dr. Merle · No Flushers",w:"Frank's Waffles · Tequesta (Vice City)",d:"Misión oculta que empieza con un póster.",h:"Encuentra y escanea un póster de «No Flushers», responde TRUTH al mensaje y queda con el Dr. Merle en Frank's Waffles. Incluye la misión escondida «The Final Flush».",r:"Aumento permanente de resistencia",t:["Sin capítulo mínimo"]},
{id:"freddie",c:"mis",x:560,y:405,n:"Freddie · el reto del búnker",w:"Complejo al norte de Lake Leonida",d:"Un búnker escondido en la finca de Freddie.",h:"Localiza su complejo al norte del lago y entra en el búnker oculto.",r:"10.000 $ y desbloquea el clima de huracán",t:["Sin capítulo mínimo"]},
{id:"kirk",c:"mis",x:385,y:600,n:"Kirk · caza del Skunk Ape",w:"Folletos en el Rusty Anchor (Key Lento) o Skeeter's (Hamlet)",d:"Cadena de 3 misiones de caza del críptido.",h:"Coge el folleto, llama a Kirk y ve de noche a su zona del pantano (cerca de Thorp Adventures, Pelican Valley). La última misión sale en el Cap. 2, con Lucía y de noche.",r:"Rifle Mister Mangrove Laird 350 y hasta 11.000 $ (y cuidado: sus feromonas convierten a Jason en rana y tendrás que comer moscas)",t:["Noche","Cap. 1 → 2"]},
{id:"missing",c:"mis",x:228,y:300,n:"Personas desaparecidas · asesino en serie",w:"Starlet Motel → almacén frente al taller de Moses · Port Gellhorn",d:"Investigación sin marcar ligada a la línea de chivatazos de Kelly County.",h:"Examina los carteles de desaparecidos del Starlet Motel y luego entra en el almacén abandonado que hay enfrente del taller de Moses.",r:"Por confirmar",t:["Cap. 2"]},
{id:"dodo",c:"mis",x:745,y:665,n:"Dodo Rising · protesta animalista",w:"Oceanario de Vice City y santuario de Bluegrass (junto al aeropuerto)",d:"Misiones que se descubren acercándote a protestas o con la cámara.",h:"Acércate a las protestas por los animales frente al Oceanario o al santuario de chimpancés de Bluegrass, o hazles foto con el móvil. Lleva a infiltrarte en el santuario.",r:"Cadena de misiones",t:[]},
{id:"shirley",c:"mis",x:655,y:925,n:"Shirley · el ron y el scooter",w:"Key Lento (vecina de Jason)",d:"Dos encargos de la vecina de Jason.",h:"Ve a la licorería de los Cayos a por su ron (pelea en las jaulas de loros de atrás) y róbale un scooter de movilidad a un vecino.",r:"Alijo de unos 1.300 $",t:["¡Perdible! Solo Cap. 1"]},
{id:"jasonhouse",c:"mis",x:628,y:940,n:"Casa de Jason · coleccionables perdibles",w:"Key Lento",d:"Cosas que solo puedes coger en el Capítulo 1.",h:"Coge las 5 revistas (mesa de centro, escritorio junto a la radio, mesilla, porche trasero y cobertizo bajo la casa) y haz la meditación de la casa antes de avanzar.",r:"Coleccionables",t:["¡Perdible! Solo Cap. 1"]},
{id:"hyde",c:"mis",x:905,y:770,n:"La trampa de Hyde Island",w:"Hyde Island",d:"Encuentro tipo película de terror: te secuestran y te cazan.",h:"Es por mala suerte: si ayudas a una mujer a mover un sofá te dan con un táser, o te disparan un dardo al llegar. Despiertas en un contenedor con un collar-bomba y un cazador «de élite» va a por ti. Sobrevive.",r:"Rifle de francotirador único",t:["Ubicación aproximada","Aleatorio"]},
{id:"kyle",c:"mis",x:520,y:375,n:"Kyle · las fresas mutantes",w:"Granja McKittrick (Cap. 2)",d:"Kyle cultiva fresas gigantes mutadas con químicos robados a la banda The Lost Chapter.",h:"Acepta un trabajo de piloto de fumigación: así conoces a Kyle. Tras sus encargos te manda un mensaje raro; cuando llegas, los federales lo tienen rodeado. Puedes matarlo (5.000 $) o dejar que destruya un laboratorio de meta de The Lost Chapter, que da más dinero y no hace falta disparar.",r:"5.000 $ o más",t:["Cap. 2","Ubicación aproximada"]},

{id:"mzbase",c:"mil",x:308,y:1010,n:"Mile Zero Air Station (base militar)",w:"Goose Key · extremo suroeste de los Cayos, junto a Southwind",d:"La única base militar de Leonida: cazas, tanques, helicópteros y blindados.",h:"Abre en el Cap. 1, después de la misión «Gone Fishing». Llegas por los puentes largos desde Key Lento, o en barco, avión o helicóptero. Si los soldados te ven dentro te disparan casi al momento. Todos los vehículos militares llevan rastreador: no se pueden registrar con Moses ni guardarlos en el garaje.",r:"Acceso a todo el material militar",t:["Zona militar","Desde Cap. 1"]},
{id:"mzjump",c:"mil",x:340,y:1023,n:"Entrada secreta: salto Mile Zero Southeast",w:"Esquina sureste de la base, camino de acceso por el sur",d:"Rampa de tierra justo delante de la alambrada.",h:"Antes de la puerta principal gira a la izquierda, pasa a los guardias, gira a la derecha y coge la rampa a tope: saltas la valla y cuenta como salto acrobático. Saltar no te salva: en cuanto te ven, empieza el tiroteo.",r:"La forma más fácil de entrar + salto acrobático",t:["Velocidad máxima"]},
{id:"rhino",c:"mil",x:296,y:1020,n:"Tanque Hauners Rhino",w:"Mile Zero · filas largas en la parte sur de la base",d:"Tanques sin cerrar: no hace falta el clonador de llaves.",h:"Tras el salto gira a la izquierda: están en filas, pasado un edificio grande y una valla. Coge el del cañón largo. Se dispara con R1 (PS5) o RB (Xbox). Llegas a 5 y luego 6 estrellas en un minuto o dos.",r:"Tanque + trofeo «Challenging Tank»",t:["Zona militar","6 estrellas"]},
{id:"lazer",c:"mil",x:318,y:1001,n:"Caza Hauners P-996 Lazer",w:"Mile Zero · zona norte, junto a hangares y pista",d:"Una fila de unos 20 cazas con ametralladoras y misiles.",h:"Ve por la pista, pasa los helicópteros y llega a la fila de cazas. Sube con Triángulo (PS5) o Y (Xbox), acelera con R2/RT y tira hacia atrás del stick izquierdo. Despega rápido: si tardas, aparecen tanques que te destrozan el avión. Al despegar, 5 estrellas y dos cazas detrás de ti.",r:"Caza",t:["Zona militar","5 estrellas"]},
{id:"buzzard",c:"mil",x:303,y:1003,n:"Helicóptero de ataque Botticher Buzzard",w:"Mile Zero · su propia zona de aparcamiento junto a la pista",d:"Helicóptero de ataque: tarda en arrancar, pero en el aire es muy ágil.",h:"Despeja a los soldados de alrededor antes de subir, porque tarda unos segundos en arrancar.",r:"Helicóptero de ataque",t:["Zona militar"]},
{id:"valkyrie",c:"mil",x:328,y:1012,n:"Helicóptero Buckingham Valkyrie",w:"Mile Zero · cerca de la entrada principal (según la comunidad)",d:"Helicóptero militar artillado.",h:"Búscalo cerca de la puerta principal nada más entrar.",r:"Helicóptero",t:["Zona militar","Sin confirmar"]},
{id:"cargobob",c:"mil",x:287,y:1008,n:"Helicóptero de carga Hauners Cargobob",w:"Mile Zero · zona de helicópteros",d:"El helicóptero de carga pesada.",h:"Su sitio exacto aún no está confirmado: recorre la zona de helicópteros de la pista.",r:"Helicóptero de carga",t:["Zona militar","Sin confirmar"]},
{id:"apc",c:"mil",x:348,y:1016,n:"Blindado Hauners APC (con cohetes)",w:"Mile Zero · aparcamiento de vehículos de tierra; a veces uno fuera de la valla junto a la rampa",d:"Blindado de transporte con cohetes montados.",h:"Mira primero fuera de la alambrada, junto a la rampa del salto: a veces hay uno ahí y te lo llevas sin entrar.",r:"Blindado",t:["Zona militar"]},
{id:"mzother",c:"mil",x:312,y:1022,n:"Mammoth Patriot y avioneta Botticher 015A",w:"Mile Zero · aparcamientos de la base",d:"Un todoterreno militar y una avioneta que también se pueden coger en la base.",h:"La avioneta está en la zona de los aviones normales. El Patriot no tiene sitio fijo confirmado.",r:"Vehículos",t:["Zona militar"]},

// ---------- estado
let found = {}; let active = new Set(Object.keys(CATS)); let query = ""; let selId = null; let onlyPending = false;
try{ found = JSON.parse(localStorage.getItem("leo_found")||"{}") }catch(e){}
function save(){ try{ localStorage.setItem("leo_found",JSON.stringify(found)) }catch(e){} }
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function visible(p){
  if(!active.has(p.c)) return false;
  if(onlyPending && found[p.id]) return false;
  if(!query) return true;
  return norm([p.n,p.w,p.d,p.h,p.r,(p.t||[]).join(" "),CATS[p.c].n].join(" ")).includes(query);
}

// ---------- chips
const chipsEl = document.getElementById("chips");
function renderChips(){
  chipsEl.innerHTML = "";
  for(const k in CATS){
    const total = P.filter(p=>p.c===k).length, f = P.filter(p=>p.c===k && found[p.id]).length;
    const b = document.createElement("div");
    b.className = "chip"+(active.has(k)?"":" off");
    b.innerHTML = `<span class="dot" style="background:${CATS[k].c}"></span>${CATS[k].i} ${CATS[k].n} <small>${f}/${total}</small>`;
    b.onclick = ()=>{ active.has(k)?active.delete(k):active.add(k); render(); };
    chipsEl.appendChild(b);
  }
}
document.getElementById("allBtn").onclick = ()=>{
  active = active.size===Object.keys(CATS).length ? new Set() : new Set(Object.keys(CATS)); render();
};
document.getElementById("q").addEventListener("input",e=>{ query = norm(e.target.value.trim()); render(); });

// ---------- pines
const NS = "http://www.w3.org/2000/svg";
const pinsEl = document.getElementById("pins");
let scaleNow = 1;
function renderPins(){
  pinsEl.innerHTML = "";
  const r = Math.max(4.5, 9/Math.sqrt(scaleNow));
  P.filter(visible).forEach(p=>{
    const g = document.createElementNS(NS,"g");
    g.setAttribute("class","pin"+(found[p.id]?" found":"")+(p.id===selId?" sel":""));
    g.setAttribute("transform",`translate(${p.x} ${p.y})`);
    g.innerHTML = `<circle class="ring" r="${r+3}" fill="none"/><circle class="b" r="${r}" fill="${CATS[p.c].c}" filter="url(#glow)"/><text style="font-size:${r*1.05}px">${CATS[p.c].i}</text>`;
    g.addEventListener("click",ev=>{ ev.stopPropagation(); if(!moved) openCard(p.id,false); });
    pinsEl.appendChild(g);
  });
}

// ---------- lista
const listEl = document.getElementById("list");
function renderList(){
  const items = P.filter(visible);
  let html = `<div class="listHead"><span>${items.length} ubicaciones</span><label><input type="checkbox" id="pend" ${onlyPending?"checked":""}> Solo pendientes</label></div>`;
  for(const k in CATS){
    const sub = items.filter(p=>p.c===k); if(!sub.length) continue;
    html += `<div class="listHead" style="position:static;color:${CATS[k].c};font-weight:700">${CATS[k].i} ${CATS[k].n}</div>`;
    sub.forEach(p=>{
      html += `<div class="li${found[p.id]?" found":""}" data-id="${p.id}"><div class="ic" style="background:${CATS[p.c].c}33">${CATS[p.c].i}</div><div><div class="t">${p.n}</div><div class="w">${p.w}</div></div><div class="ck">${found[p.id]?"✅":""}</div></div>`;
    });
  }
  if(!items.length) html += `<div class="info">Nada con ese filtro. Prueba otra búsqueda o activa más categorías.</div>`;
  html += `<div class="info">Datos recopilados de guías de la comunidad desde el lanzamiento (19 nov 2026) · última actualización: 25 nov 2026. Algunas ubicaciones aún no están verificadas y pueden cambiar con parches. Web de fans sin relación con Rockstar Games.</div>`;
  listEl.innerHTML = html;
  listEl.querySelectorAll(".li").forEach(el=>el.onclick=()=>{ document.body.classList.remove("listMode"); setTab("map"); openCard(el.dataset.id,true); });
  const pend = document.getElementById("pend"); if(pend) pend.onchange = e=>{ onlyPending = e.target.checked; render(); };
}

function renderProgress(){
  const f = P.filter(p=>found[p.id]).length;
  document.getElementById("pCount").textContent = `${f}/${P.length}`;
  document.getElementById("pBar").style.width = (100*f/P.length)+"%";
}
function render(){ renderChips(); renderPins(); renderList(); renderProgress(); }

// ---------- ficha
const card = document.getElementById("card");
function openCard(id,center){
  const p = P.find(q=>q.id===id); if(!p) return;
  selId = id;
  const tags = (p.t||[]).map(t=>`<span class="tag${/perdible|vigilad|militar|polic|estrella|buscan/i.test(t)?" warn":""}">${t}</span>`).join("");
  card.innerHTML = `<button class="x" aria-label="Cerrar">×</button>
    <div class="cat" style="color:${CATS[p.c].c}">${CATS[p.c].i} ${CATS[p.c].n}</div>
    <h2>${p.n}</h2><div class="where">📍 ${p.w}</div>
    <div>${tags}</div>
    <div class="row">${p.d}</div>
    <div class="row"><b>Cómo:</b> ${p.h}</div>
    <div class="row"><b>Premio:</b> ${p.r}</div>
    <div class="actions"><button id="fBtn" class="${found[p.id]?"on":""}">${found[p.id]?"✅ Encontrado":"Marcar como encontrado"}</button></div>`;
  card.classList.add("show");
  card.querySelector(".x").onclick = closeCard;
  card.querySelector("#fBtn").onclick = ()=>{ found[p.id] = !found[p.id]; if(!found[p.id]) delete found[p.id]; save(); render(); openCard(p.id,false); };
  if(center) flyTo(p.x,p.y,Math.max(scaleNow,3));
  renderPins();
}
function closeCard(){ card.classList.remove("show"); selId=null; renderPins(); }

// ---------- pan / zoom
const svg = document.getElementById("map");
const W0 = 1000, H0 = 1080;
let vb = {x:0,y:0,w:W0,h:H0};
function applyVB(){
  svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const ns = W0/vb.w; if(Math.abs(ns-scaleNow)/scaleNow>0.08){ scaleNow = ns; renderPins(); }
}
function clientToSvg(cx,cy){
  const r = svg.getBoundingClientRect();
  const s = Math.max(vb.w/r.width, vb.h/r.height);
  const ox = (r.width*s - vb.w)/2, oy = (r.height*s - vb.h)/2;
  return {x: vb.x + (cx-r.left)*s - ox, y: vb.y + (cy-r.top)*s - oy, s};
}
function zoomAt(cx,cy,f){
  const p = clientToSvg(cx,cy);
  let nw = Math.min(W0*1.2, Math.max(W0/14, vb.w/f)); f = vb.w/nw;
  vb.x = p.x - (p.x - vb.x)/f; vb.y = p.y - (p.y - vb.y)/f; vb.w = nw; vb.h = vb.h/f; applyVB();
}
function flyTo(x,y,scale){
  const tw = W0/scale, th = H0/scale, sx=vb.x, sy=vb.y, sw=vb.w, sh=vb.h, ex=x-tw/2, ey=y-th/2; let t0=null;
  function step(ts){ if(!t0) t0=ts; let k=Math.min(1,(ts-t0)/350); k=1-Math.pow(1-k,3);
    vb={x:sx+(ex-sx)*k,y:sy+(ey-sy)*k,w:sw+(tw-sw)*k,h:sh+(th-sh)*k}; applyVB(); if(k<1) requestAnimationFrame(step); }
  requestAnimationFrame(step);
}
const ptrs = new Map(); let last = null, moved = false, pinchD = 0;
svg.addEventListener("pointerdown",e=>{ svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false; last={x:e.clientX,y:e.clientY}; if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinchD=Math.hypot(a.x-b.x,a.y-b.y);} svg.classList.add("drag"); });
svg.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinchD){ zoomAt((a.x+b.x)/2,(a.y+b.y)/2,d/pinchD); } pinchD=d; moved=true; return;
  }
  const dx=e.clientX-last.x, dy=e.clientY-last.y;
  if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
  const r = svg.getBoundingClientRect(); const s = Math.max(vb.w/r.width, vb.h/r.height);
  vb.x -= dx*s; vb.y -= dy*s; last={x:e.clientX,y:e.clientY}; applyVB();
});
function up(e){ ptrs.delete(e.pointerId); pinchD=0; if(ptrs.size===1){ const v=[...ptrs.values()][0]; last={x:v.x,y:v.y}; } if(!ptrs.size) svg.classList.remove("drag"); setTimeout(()=>moved=false,30); }
svg.addEventListener("pointerup",up); svg.addEventListener("pointercancel",up);
svg.addEventListener("wheel",e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY,e.deltaY<0?1.2:1/1.2); },{passive:false});
svg.addEventListener("click",()=>{ if(!moved && card.classList.contains("show")) closeCard(); });
const mid = ()=>{ const r=svg.getBoundingClientRect(); return [r.left+r.width/2,r.top+r.height/2]; };
document.getElementById("zin").onclick=()=>zoomAt(...mid(),1.5);
document.getElementById("zout").onclick=()=>zoomAt(...mid(),1/1.5);
document.getElementById("zreset").onclick=()=>flyTo(W0/2,H0/2,1);
document.getElementById("goBase").onclick=()=>{ setTab("map"); active.add("mil"); render(); flyTo(318,1012,9); };

// ---------- pestañas móvil
function setTab(t){ document.getElementById("tMap").classList.toggle("act",t==="map"); document.getElementById("tList").classList.toggle("act",t==="list"); document.body.classList.toggle("listMode",t==="list"); }
document.getElementById("tMap").onclick=()=>setTab("map");
document.getElementById("tList").onclick=()=>setTab("list");

render();
</script>
